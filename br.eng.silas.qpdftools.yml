id: br.eng.silas.qpdftools
runtime: org.kde.Platform
runtime-version: '6.10'
sdk: org.kde.Sdk
command: qpdftools
cleanup:
  - '/include'
  - '/share/doc'
  - '/share/man'
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --filesystem=home
  - --share=ipc
  - --device=dri
modules:
  - name: ghostscript
    config-opts:
      - --disable-cups
      - --disable-dbus
      - --disable-gtk
    sources:
      - type: archive
        url: https://github.com/ArtifexSoftware/ghostpdl-downloads/releases/download/gs10080/ghostscript-10.08.0.tar.gz
        sha256: caf199e3f233f1290b27d0972d636f66c303355f2353309b7bfddf1edda06b3d
        x-checker-data:
          type: anitya
          project-id: 1157
          url-template: https://github.com/ArtifexSoftware/ghostpdl-downloads/releases/download/gs${major}${minor}${patch}/ghostscript-$version.tar.gz

  - name: qpdf
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
    sources:
      - type: archive
        url: https://github.com/qpdf/qpdf/archive/refs/tags/v12.4.2.tar.gz
        sha256: 88ddeb5f25c6e9156f3113fc3994d3a5e0cdfeee398cd09dd00fabc9dac9f573
        x-checker-data:
          type: anitya
          project-id: 5542
          url-template: https://github.com/qpdf/qpdf/archive/refs/tags/v$version.tar.gz

  - name: qpdftools
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
    sources:
      - type: git
        url: https://github.com/silash35/qpdftools.git
        tag: v3.1.3
        commit: 22da16c6c69e7831a374ade5456816eeca8d3773
        x-checker-data:
          type: git
          tag-pattern: v([\d.]+)$
